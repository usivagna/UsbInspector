# This workflow builds the UsbInspector solution and runs its unit tests.
#
# The app targets .NET 9 (net9.0-windows10.0.26100.0) and WinUI 3, so the build
# runs on a Windows runner with the .NET 9 SDK. The projects only define the
# x86/x64/ARM64 platforms (there is no "Any CPU"), and the Windows runners ship
# an x64 .NET 9 runtime but no x86 one, so the build and the test host are
# pinned to x64.
#
# For more information on GitHub Actions, refer to https://docs.github.com/actions

name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: UsbInspector.sln
      Test_Project_Path: tests\UsbInspector.Core.Tests\UsbInspector.Core.Tests.csproj
      Build_Platform: x64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET SDK used by the solution
    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore the solution
      run: dotnet restore $env:Solution_Name -p:Platform=$env:Build_Platform

    - name: Build the solution
      run: dotnet build $env:Solution_Name --no-restore -c $env:Configuration -p:Platform=$env:Build_Platform
      env:
        Configuration: ${{ matrix.configuration }}

    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: dotnet test $env:Test_Project_Path --no-build -c $env:Configuration -p:Platform=$env:Build_Platform
      env:
        Configuration: ${{ matrix.configuration }}
